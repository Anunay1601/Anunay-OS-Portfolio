<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424" />
      <stop offset="50%" stop-color="#070913" />
      <stop offset="100%" stop-color="#020308" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="50%" stop-color="rgba(10, 132, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="12" />

  <!-- Inner Ambient Orb -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.22" filter="url(#softGlow)" />

  <!-- Glowing Apple/VisionOS Style Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="14 10" opacity="0.45" />

  <!-- Monogram Glyph 'A' -->
  <path d="M 256 128 L 356 364 H 304 L 282 312 H 230 L 208 364 H 156 Z M 256 186 L 241 270 H 271 Z" fill="url(#accentGrad)" filter="url(#softGlow)" />
  <path d="M 256 128 L 356 364 H 304 L 282 312 H 230 L 208 364 H 156 Z M 256 186 L 241 270 H 271 Z" fill="#FFFFFF" opacity="0.95" />
</svg>
